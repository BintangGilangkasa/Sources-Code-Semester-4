<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>RESTO Ny. MILAN</h1>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="produk.html">Produk</a>
            <a href="pesan.html">Pesan</a>
        </nav>
    </header>

    <section class="welcome">
        <div class="container">
            <h2>Formulir Pemesanan</h2>
            <p>Silakan isi formulir di bawah ini untuk melakukan pemesanan. Kami akan segera menghubungi Anda untuk konfirmasi.</p>
        </div>
    </section>
    
    <section class="order-section">
        <form id="orderForm" class="order-form">
            <fieldset>
                <legend>Formulir Pemesanan</legend>

                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" required>

                <label for="menu">Pilih Menu:</label>
                <select id="menu" name="menu" required>
                    <option value="">--Pilih Makanan--</option>
                    <option>Kopi Arabika</option>
                    <option>Turkish Coffee</option>
                    <option>Steak Tenderloin</option>
                    <option>Cheesecake</option>
                </select>

                <label for="jumlah">Jumlah:</label>
                <input type="number" id="jumlah" name="jumlah" required min="1">

                <label for="alamat">Alamat Pengiriman:</label>
                <textarea id="alamat" name="alamat" rows="4" required></textarea>

                <button type="submit">Kirim Pesanan</button>
            </fieldset>
        </form>
    </section>

    <footer>&copy; 2025 RESTO Ny. MILAN</footer>
</body>
</html>
